name: Static Analysis Pylint

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f "LeasePro-Cloudfolder/requirements.txt" ]; then
            pip install -r LeasePro-Cloudfolder/requirements.txt
          fi
          pip install pylint pylint-django

      - name: Run pylint
        run: |
          # FIX: Ensuring the runner finds the app modules
          export PYTHONPATH=$PYTHONPATH:$(pwd)/LeasePro-Cloudfolder
          
          # FIX: Ignoring the .c9 metadata and using the correct settings path
          pylint $(find LeasePro-Cloudfolder -name "*.py" -not -path "*/venv/*" -not -path "*/migrations/*" -not -path "*/.c9/*") \
          --load-plugins pylint_django \
          --django-settings-module=propertymanager.settings \
          --fail-under=5.0
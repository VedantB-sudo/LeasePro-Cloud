name: Static Analysis Pylint

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip

          # This logic checks the root, then your project subfolder
          if [ -f "requirements.txt" ]; then
            echo "Found requirements.txt in root"
            pip install -r requirements.txt
          elif [ -f "LeasePro-Cloud/requirements.txt" ]; then
            echo "Found requirements.txt in LeasePro-Cloud folder"
            pip install -r LeasePro-Cloud/requirements.txt
          else
            echo "ERROR: requirements.txt not found anywhere!"
            ls -R
            exit 1
          fi

          pip install pylint pylint-django

      - name: Run pylint
        run: |
          # This find command handles both root or subfolder Python files
          pylint $(find . -name "*.py" -not -path "*/venv/*")
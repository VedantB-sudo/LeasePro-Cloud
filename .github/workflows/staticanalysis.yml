name: Static Analysis Pylint

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip

          if [ -f "requirements.txt" ]; then
            pip install -r requirements.txt
          elif [ -f "LeasePro-Cloudfolder/requirements.txt" ]; then
            pip install -r LeasePro-Cloudfolder/requirements.txt
          else
            echo "ERROR: requirements.txt not found!"
            exit 1
          fi

          pip install pylint pylint-django

      - name: Run pylint
        run: |
          export PYTHONPATH=$PYTHONPATH:$(pwd)/LeasePro-Cloudfolder
          pylint $(find . -name "*.py" -not -path "*/venv/*" -not -path "*/migrations/*") \
          --load-plugins pylint_django \
          --django-settings-module=core.settings \
          --fail-under=5.0
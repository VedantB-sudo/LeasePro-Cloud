name: Static Analysis Pylint

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Path updated: requirements.txt is now in the root
          if [ -f "requirements.txt" ]; then
            pip install -r requirements.txt
          fi
          pip install pylint pylint-django

      - name: Run pylint
        run: |
          # Path updated: PYTHONPATH now points to the current root
          export PYTHONPATH=$PYTHONPATH:$(pwd)
          
          # Path updated: find command now starts at root
          pylint $(find . -name "*.py" -not -path "*/venv/*" -not -path "*/migrations/*" -not -path "*/.c9/*") \
          --load-plugins pylint_django \
          --django-settings-module=propertymanager.settings \
          --fail-under=5.0
name: CI/CD Pipeline to AWS EC2 via SSH

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4 # Updated to v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5 # Updated to v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        working-directory: ./LeasePro-Cloud 
        run: |
          python -m pip install --upgrade pip
          pip install Pillow bandit
          pip install -r requirements.txt

      - name: Run Security Scan & Tests
        working-directory: ./LeasePro-Cloud
        run: |
          bandit -r . -f txt -o security_report.txt || true
          python manage.py test
        env:
          DB_ENGINE: django.db.backends.sqlite3
          SECRET_KEY: test_secret_key
          DEBUG: 1

      - name: Upload Security Artifact
        uses: actions/upload-artifact@v4
        with:
          name: security-report
          path: ./LeasePro-Cloud/security_report.txt

  deploy:
    name: Deploy to EC2 via SSH
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_PUBLIC_IP }}
          username: ubuntu 
          key: ${{ secrets.AWS_SSH_PRIVATE_KEY }}
          script: |
            cd /home/ubuntu/LeasePro-Cloud
            git pull origin main
            source venv/bin/activate
            pip install -r requirements.txt
            python manage.py migrate
            sudo systemctl restart gunicorn
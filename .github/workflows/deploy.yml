name: CI/CD Pipeline to AWS Elastic Beanstalk

on:
  workflow_dispatch:

jobs:
  security_scan:
    name: Static Security Analysis (Bandit)
    # Removed dependency on 'test'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Bandit
        run: pip install bandit

      - name: Run Bandit Scan
        working-directory: ./LeasePro-Cloud
        run: |
          bandit -r . -f txt -o bandit_report.txt || true

      - name: Upload Security Artifact
        uses: actions/upload-artifact@v4 
        with:
          name: security-audit
          path: ./LeasePro-Cloud/bandit_report.txt

  lint:
    name: Code Quality (Pylint)
    # Removed dependency on 'test'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Linting Dependencies
        working-directory: ./LeasePro-Cloud
        run: |
          python -m pip install --upgrade pip
          pip install pylint pylint-django
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run Pylint
        working-directory: ./LeasePro-Cloud
        run: |
          pylint --load-plugins pylint_django --django-settings-module=LeasePro-Cloud.settings . --exit-zero

  deploy:
    name: Cloud Deployment
    # Requires security and quality scans to pass before proceeding
    needs: [security_scan, lint]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Generate Deployment Package
        run: zip -r deploy.zip . -x "*.git*" "venv/*"

      - name: Deploy to EB
        uses: einaregilsson/beanstalk-deploy@v22
        with:
          aws_access_key: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws_secret_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          session_token: ${{ secrets.AWS_SESSION_TOKEN }} 
          application_name: ${{ secrets.EB_APPLICATION_NAME }}
          environment_name: ${{ secrets.EB_ENVIRONMENT_NAME }}
          version_label: ${{ github.sha }}
          region: ${{ secrets.AWS_REGION }}
          deployment_package: deploy.zip
name: CI/CD Pipeline to AWS Elastic Beanstalk

on:
  push:
    branches: [ main ]

jobs:
  # --- STAGE 1: LINT ---
  lint:
    name: Static Analysis (Pylint)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pylint pylint-django

      - name: Run Pylint
        run: |
          export PYTHONPATH=$PYTHONPATH:$(pwd)
          pylint $(find . -name "*.py" -not -path "*/venv/*" -not -path "*/migrations/*" -not -path "*/.c9/*") \
          --load-plugins pylint_django \
          --django-settings-module=propertymanager.settings \
          --fail-under=5.0

  # --- STAGE 2: SONARQUBE & TESTING ---
  sonarqube:
    name: SonarQube Analysis
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install Dependencies & Coverage Tool
        run: |
          pip install -r requirements.txt
          pip install coverage

      - name: Run Tests & Generate Coverage Report
        env:
          DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
        run: |
          coverage run --source='.' manage.py test
          coverage xml -o coverage.xml

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=VedantB-sudo_LeasePro-Cloud
            -Dsonar.organization=vedantb-sudo
            -Dsonar.sources=.
            -Dsonar.python.version=3.9
            -Dsonar.python.coverage.reportPaths=coverage.xml
            -Dsonar.secrets.activated=true
            -Dsonar.yaml.file.suffixes=.yaml,.yml
            -Dsonar.exclusions=**/migrations/**,**/venv/**,**/.c9/**,manage.py,**/tests.py

  # --- STAGE 3: DEPLOY ---
  deploy:
    name: Deploy to Elastic Beanstalk
    runs-on: ubuntu-latest
    needs: sonarqube
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Generate deployment package
        run: |
          zip -r deploy.zip . -x "*.git*" "venv/*" ".c9/*"

      - name: Deploy to AWS Elastic Beanstalk
        uses: einaregilsson/beanstalk-deploy@27edd8a0ebe8656ac70654372c73f06f7e9a1027
        with:
          aws_access_key: ASIA5Y4HIRIRVRBMACJW
          aws_secret_key: +58ARhMJAtfUMi95xuUqlGMN7Lxbi+L9L5dACdEp
          aws_session_token: ${{ secrets.AWS_SESSION_TOKEN_LITERAL || '' }}
          application_name: LeasePro-Cloud 
          environment_name: LeasePro-Cloud-env 
          region: "us-east-1"
          version_label: "app-${{ github.sha }}"
          deployment_package: deploy.zip
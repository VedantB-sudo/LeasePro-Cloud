name: CI/CD Pipeline to AWS EC2 via SSH

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3
        with:
          submodules: false

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config default-libmysqlclient-dev build-essential
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install bandit

      - name: Run Security Scan & Tests
        run: |
          bandit -r . -f txt -o security_report.txt || true
          python manage.py test
        env:
          DB_ENGINE: django.db.backends.sqlite3
          SECRET_KEY: test_secret_key
          DEBUG: 1

  deploy:
    name: Deploy to EC2 via SSH
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          # Use the Public IP from your EC2 Console
          host: ${{ secrets.EC2_PUBLIC_IP }}
          # 'ubuntu' is the default user for Ubuntu AMIs
          username: ubuntu 
          # This is your vockey content
          key: ${{ secrets.AWS_SSH_PRIVATE_KEY }}
          # This pulls the code and restarts the server
          script: |
            cd /home/ubuntu/LeasePro-Cloud
            git pull origin main
            source venv/bin/activate
            pip install -r requirements.txt
            python manage.py migrate
            python manage.py collectstatic --noinput
            sudo systemctl restart gunicorn
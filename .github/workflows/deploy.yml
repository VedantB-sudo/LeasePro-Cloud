name: CI/CD Pipeline to AWS Elastic Beanstalk

on:
  push:
    branches: [ main ]

jobs:
  # --- STAGE 1: LINT ---
  lint:
    name: Static Analysis (Pylint)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pylint pylint-django

      - name: Run Pylint
        run: |
          export PYTHONPATH=$PYTHONPATH:$(pwd)
          pylint $(find . -name "*.py" -not -path "*/venv/*" -not -path "*/migrations/*" -not -path "*/.c9/*") \
          --load-plugins pylint_django \
          --django-settings-module=propertymanager.settings \
          --fail-under=5.0

  # --- STAGE 2: SONARQUBE ---
  sonarqube:
    name: SonarQube Analysis
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=VedantB-sudo_LeasePro-Cloud
            -Dsonar.organization=vedantb-sudo
            -Dsonar.sources=.
            -Dsonar.python.version=3.11
            -Dsonar.exclusions=**/migrations/**,**/venv/**,**/.c9/**

  # --- STAGE 3: DEPLOY ---
  deploy:
    name: Deploy to Elastic Beanstalk
    runs-on: ubuntu-latest
    needs: sonarqube
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Generate deployment package
        run: |
          # Exclude environment files and static assets to keep the package small
          zip -r deploy.zip . -x "*.git*" "venv/*" ".c9/*" "staticfiles/*"

      - name: Deploy to AWS Elastic Beanstalk
        uses: einaregilsson/beanstalk-deploy@v22
        with:
          aws_access_key: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws_secret_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws_session_token: ${{ secrets.AWS_SESSION_TOKEN }} 
          application_name: "LeasePro-Cloud"
          environment_name: "LeasePro-Cloud-env"
          region: "us-east-1"
          version_label: "app-${{ github.sha }}"
          deployment_package: deploy.zip
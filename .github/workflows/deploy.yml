name: CI/CD Pipeline to AWS Elastic Beanstalk

on:
  push:
    branches: [ main ]

jobs:
  # --- STAGE 1: LINT ---
  lint:
    name: Static Analysis (Pylint)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pylint pylint-django

      - name: Run Pylint
        run: |
          export PYTHONPATH=$PYTHONPATH:$(pwd)
          pylint $(find . -name "*.py" -not -path "*/venv/*" -not -path "*/migrations/*" -not -path "*/.c9/*") \
          --load-plugins pylint_django \
          --django-settings-module=propertymanager.settings \
          --fail-under=5.0

  # --- STAGE 2: SONARQUBE & TESTING ---
  sonarqube:
    name: SonarQube Analysis
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install Dependencies & Coverage Tool
        run: |
          pip install -r requirements.txt
          pip install coverage

      - name: Run Tests & Generate Coverage Report
        env:
          # Use the secret you added to GitHub so tests pass without security hotspots
          DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
        run: |
          # CHANGED: --source='.' ensures settings.py and other project files are scanned
          coverage run --source='.' manage.py test
          coverage xml -o coverage.xml

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@db501078e936e4b4c8773d1bb949ba9ddb7b6b6a
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=VedantB-sudo_LeasePro-Cloud
            -Dsonar.organization=vedantb-sudo
            -Dsonar.sources=.
            -Dsonar.python.version=3.9
            -Dsonar.python.coverage.reportPaths=coverage.xml
            -Dsonar.exclusions=**/migrations/**,**/venv/**,**/.c9/**,manage.py,**/tests.py

  # --- STAGE 3: DEPLOY ---
  deploy:
    name: Deploy to Elastic Beanstalk
    runs-on: ubuntu-latest
    needs: sonarqube
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Generate deployment package
        run: |
          # Ensure we include the static directory we created
          zip -r deploy.zip . -x "*.git*" "venv/*" ".c9/*"

      - name: Deploy to AWS Elastic Beanstalk
        uses: einaregilsson/beanstalk-deploy@27edd8a0ebe8656ac70654372c73f06f7e9a1027
        with:
          aws_access_key: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws_secret_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws_session_token: ${{ secrets.AWS_SESSION_TOKEN }} 
          application_name: ${{ secrets.EB_APPLICATION_NAME }} 
          environment_name: ${{ secrets.EB_ENVIRONMENT_NAME }} 
          region: "us-east-1"
          version_label: "app-${{ github.sha }}"
          deployment_package: deploy.zip
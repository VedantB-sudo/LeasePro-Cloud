name: CI/CD Pipeline to AWS Elastic Beanstalk

on:
  workflow_dispatch:

jobs:
  test:
    name: Unit Testing
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Dependencies
        working-directory: ./LeasePro-Cloud 
        run: |
          python -m pip install --upgrade pip
          pip install Pillow gunicorn
          pip install -r requirements.txt

      - name: Run Tests
        working-directory: ./LeasePro-Cloud
        run: python manage.py test

  security_scan:
    name: Static Security Analysis (Bandit)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Bandit
        run: pip install bandit

      - name: Run Bandit Scan
        # Scans your nested folder and generates a report
        working-directory: ./LeasePro-Cloud
        run: |
          bandit -r . -f txt -o bandit_report.txt || true

      - name: Upload Security Artifact
        uses: actions/upload-artifact@v3
        with:
          name: security-audit
          path: ./LeasePro-Cloud/bandit_report.txt

  deploy:
    name: Cloud Deployment
    needs: security_scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Generate Deployment Package
        # Zips the nested application folder specifically to prevent path errors
        run: zip -r deploy.zip . -x "*.git*" "venv/*"

      - name: Deploy to EB
        uses: einaregilsson/beanstalk-deploy@v22
        with:
          aws_access_key: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws_secret_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          session_token: ${{ secrets.AWS_SESSION_TOKEN }} 
          application_name: ${{ secrets.EB_APPLICATION_NAME }}
          environment_name: ${{ secrets.EB_ENVIRONMENT_NAME }}
          version_label: ${{ github.sha }}
          region: ${{ secrets.AWS_REGION }}
          deployment_package: deploy.zip
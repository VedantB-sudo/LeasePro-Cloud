name: CI/CD Pipeline to AWS Elastic Beanstalk

on:
  push:
    branches: [ main ]

jobs:
  # --- LAYER 1: STATIC TESTING ---
  lint:
    name: Static Analysis (Pylint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./LeasePro-Cloudfolder
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pylint pylint-django

      - name: Run Pylint
        run: |
          export PYTHONPATH=$PYTHONPATH:$(pwd)
          pylint $(find . -name "*.py" -not -path "*/venv/*" -not -path "*/migrations/*" -not -path "*/.c9/*") \
          --load-plugins pylint_django \
          --django-settings-module=propertymanager.settings \
          --fail-under=5.0

  # --- LAYER 2: SONARQUBE CLOUD ANALYSIS ---
  sonarqube:
    name: SonarQube Analysis
    runs-on: ubuntu-latest
    needs: lint  # Only runs if Pylint is successful
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Necessary for SonarCloud to see commit history

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          # Targeting LeasePro-Cloudfolder directly
          args: >
            -Dsonar.projectKey=VedantB-sudo_LeasePro-Cloud
            -Dsonar.organization=vedantb-sudo
            -Dsonar.sources=LeasePro-Cloudfolder
            -Dsonar.python.version=3.11
            -Dsonar.exclusions=**/migrations/**,**/venv/**,**/.c9/**

  # --- LAYER 3: DEPLOYMENT ---
  deploy:
    name: Deploy to Elastic Beanstalk
    runs-on: ubuntu-latest
    needs: sonarqube  # Deployment now waits for SonarQube to pass
    defaults:
      run:
        working-directory: ./LeasePro-Cloudfolder
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate Deployment Package
        # Excludes same junk files as Pylint
        run: zip -r deploy.zip . -x "*.git*" "venv/*" ".c9/*"

      - name: Deploy to AWS Elastic Beanstalk
        uses: einaregilsson/beanstalk-deploy@v21
        with:
          aws_access_key: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws_secret_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws_session_token: ${{ secrets.AWS_SESSION_TOKEN }} 
          application_name: "Incident_management"
          environment_name: "Incidentmanagement-env"
          region: "us-east-1"
          version_label: "app-${{ github.sha }}"
          deployment_package: LeasePro-Cloudfolder/deploy.zip
name: CI/CD Pipeline to AWS Elastic Beanstalk

on:
  push:
    branches: [ main ]

jobs:
  # --- LAYER 1: STATIC TESTING ---
  lint:
    name: Static Analysis (Pylint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./LeasePro-Cloudfolder
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pylint pylint-django

      - name: Run Pylint
        run: |
          export PYTHONPATH=$PYTHONPATH:$(pwd)
          pylint $(find . -name "*.py" -not -path "*/venv/*" -not -path "*/migrations/*") \
          --load-plugins pylint_django \
          --django-settings-module=core.settings \
          --fail-under=5.0

  # --- LAYER 2: DEPLOYMENT ---
  deploy:
    name: Deploy to Elastic Beanstalk
    runs-on: ubuntu-latest
    needs: lint
    defaults:
      run:
        working-directory: ./LeasePro-Cloudfolder
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate Deployment Package
        run: zip -r deploy.zip . -x "*.git*" "venv/*" ".c9/*"

      - name: Deploy to AWS Elastic Beanstalk
        uses: einaregilsson/beanstalk-deploy@v21
        with:
          aws_access_key: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws_secret_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws_session_token: ${{ secrets.AWS_SESSION_TOKEN }} 
          application_name: "Incident_management"
          environment_name: "Incidentmanagement-env"
          region: "us-east-1"
          version_label: "app-${{ github.sha }}"
          deployment_package: LeasePro-Cloudfolder/deploy.zip
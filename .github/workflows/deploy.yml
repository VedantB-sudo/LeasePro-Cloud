name: CI/CD Pipeline to AWS Elastic Beanstalk

on:
  workflow_dispatch:

jobs:
  test:
    name: Run Tests and Security Scan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: LeasePro-Cloud 
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install System Dependencies
        # This will now correctly find the directory and run
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config default-libmysqlclient-dev build-essential
          
      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install bandit

      - name: Run Security Scan (Bandit)
        run: bandit -r . -f txt -o security_report.txt || true

      - name: Run Django Tests
        env:
          DB_ENGINE: django.db.backends.sqlite3
          SECRET_KEY: test_secret_key
          DEBUG: 1
        run: python manage.py test

  deploy:
    name: Deploy to Elastic Beanstalk
    needs: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: LeasePro-Cloud # Simplified path

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Generate Deployment Package
        run: zip -r deploy.zip . -x '*.git*'

      - name: Deploy to AWS Elastic Beanstalk
        uses: einaregilsson/beanstalk-deploy@v22
        with:
          aws_access_key: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws_secret_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          session_token: ${{ secrets.AWS_SESSION_TOKEN }}
          application_name: ${{ secrets.EB_APPLICATION_NAME }}
          environment_name: ${{ secrets.EB_ENVIRONMENT_NAME }}
          version_label: "app-${{ github.sha }}"
          region: ${{ secrets.AWS_REGION }}
          deployment_package: LeasePro-Cloud/deploy.zip
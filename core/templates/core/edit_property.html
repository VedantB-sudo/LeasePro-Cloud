<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Listing | LeasePro</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --bg-light: #f8fafc;
            --text-dark: #1e293b;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --white: #ffffff;
            --danger: #ef4444;
        }

        body { 
            font-family: 'Inter', sans-serif; 
            margin: 0; 
            display: flex; 
            background-color: var(--bg-light);
            /* Soft geometric grid background */
            background-image: radial-gradient(#cbd5e1 0.5px, transparent 0.5px);
            background-size: 30px 30px;
            color: var(--text-dark);
            min-height: 100vh;
        }

        /* Sidebar Styling */
        .sidebar { 
            width: 260px; 
            background: var(--white); 
            height: 100vh; 
            position: fixed; 
            padding: 40px 30px; 
            box-sizing: border-box; 
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .sidebar .logo { 
            color: var(--primary); 
            font-weight: 800;
            font-size: 1.5rem;
            letter-spacing: -1px;
            text-decoration: none;
            margin-bottom: 20px;
        }

        .back-link {
            color: var(--text-muted);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 600;
            font-size: 0.95rem;
            transition: color 0.2s;
        }

        .back-link:hover { color: var(--primary); }

        /* Main Content Area */
        .main-content { 
            flex: 1; 
            margin-left: 260px; 
            padding: 60px; 
            display: flex;
            justify-content: center;
        }

        .card { 
            background: var(--white); 
            padding: 45px; 
            border-radius: 24px; 
            border: 1px solid var(--border);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05); 
            width: 100%;
            max-width: 650px; 
        }

        h1 { margin: 0 0 8px 0; font-weight: 800; font-size: 1.75rem; color: var(--text-dark); }

        .form-group { margin-bottom: 25px; }

        /* Current Image Display */
        .current-img-container {
            background: #f1f5f9;
            padding: 12px;
            border-radius: 12px;
            border: 1px solid var(--border);
            margin: 10px 0 25px 0;
            display: inline-block;
        }

        .current-img { 
            width: 140px; 
            height: 90px; 
            object-fit: cover; 
            border-radius: 8px; 
            display: block; 
        }

        /* Form Elements Style */
        form p {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 24px !important;
            width: 100%;
        }

        form label {
            font-weight: 600;
            font-size: 0.9rem;
            color: var(--text-dark);
        }

        input:not([type="file"]):not([type="checkbox"]), textarea, select {
            width: 100%;
            padding: 12px 16px;
            background: #f1f5f9;
            border: 1px solid var(--border);
            border-radius: 10px;
            color: var(--text-dark);
            box-sizing: border-box;
            font-family: inherit;
            transition: all 0.2s;
            font-size: 0.95rem;
        }

        input:focus, textarea:focus {
            background: white;
            border-color: var(--primary);
            outline: none;
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.1);
        }

        /* File Input Styling */
        input[type="file"] {
            background: #f8fafc;
            padding: 10px;
            border-radius: 10px;
            border: 1px dashed var(--border);
            width: 100%;
            box-sizing: border-box;
        }

        input[type="file"]::file-selector-button {
            background: var(--primary);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            margin-right: 15px;
            transition: background 0.2s;
        }

        input[type="file"]::file-selector-button:hover { background: var(--primary-hover); }

        /* Action Buttons */
        .btn-save { 
            background: var(--primary); 
            color: white; 
            border: none; 
            padding: 16px; 
            border-radius: 12px; 
            cursor: pointer; 
            font-weight: 700;
            text-transform: none;
            font-size: 1rem;
            transition: all 0.2s;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-save:hover { 
            background: var(--primary-hover);
            transform: translateY(-1px);
            box-shadow: 0 10px 15px -3px rgba(37, 99, 235, 0.2); 
        }

        .btn-cancel { 
            color: var(--text-muted); 
            text-decoration: none; 
            font-weight: 600;
            font-size: 0.95rem;
            transition: color 0.2s;
            display: block;
            text-align: center;
            margin-top: 20px;
        }

        .btn-cancel:hover { color: var(--danger); }

        hr { border: 0; border-top: 1px solid var(--border); margin: 30px 0; }
        
        /* Checkbox styling */
        input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: var(--primary);
            cursor: pointer;
        }

        /* Links within form (Django clear/change links) */
        form p a {
            color: var(--primary);
            font-size: 0.85rem;
            text-decoration: none;
            font-weight: 500;
        }
    </style>
</head>
<body>

    <nav class="sidebar">
        <a href="{% url 'home' %}" class="logo">LeasePro</a>
        <a href="{% url 'dashboard' %}" class="back-link">
            <i class="fas fa-arrow-left"></i> Dashboard
        </a>
    </nav>

    <main class="main-content">
        <div class="card">
            <h1>Edit Property</h1>
            <p style="color: var(--text-muted); margin-top: 0;">
                Modifying: <span style="color: var(--primary); font-weight: 700;">{{ property.address }}</span>
            </p>
            <hr>
            
            <form method="post" enctype="multipart/form-data">
                {% csrf_token %}
                
                {% if property.image %}
                    <div class="form-group">
                        <label>Current Listing Image</label>
                        <div class="current-img-container">
                            <img src="{{ property.image.url }}" class="current-img">
                        </div>
                    </div>
                {% endif %}

                <div class="form-group">
                    {{ form.as_p }}
                </div>

                <div style="margin-top: 40px;">
                    <button type="submit" class="btn-save">
                        <i class="fas fa-cloud-arrow-up"></i> Save Changes
                    </button>
                    <a href="{% url 'property_detail' property.pk %}" class="btn-cancel">
                        Discard and Return
                    </a>
                </div>
            </form>
        </div>
    </main>

</body>
</html>

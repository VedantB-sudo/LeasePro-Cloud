<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Listing | LeasePro</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --bg-deep: #050a15;
            --bg-card: #0d1425;
            --accent-gold: #fbbf24;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #1e293b;
        }

        body { 
            font-family: 'Inter', sans-serif; 
            margin: 0; 
            display: flex; 
            background-color: var(--bg-deep); 
            color: var(--text-main);
            min-height: 100vh;
        }

        /* Sidebar Styling */
        .sidebar { 
            width: 260px; 
            background: var(--bg-card); 
            height: 100vh; 
            position: fixed; 
            padding: 30px; 
            box-sizing: border-box; 
            border-right: 1px solid var(--border);
        }

        .sidebar h2 { 
            color: var(--accent-gold); 
            margin-top: 0;
            font-weight: 800;
            letter-spacing: -1px;
        }

        .back-link {
            color: var(--text-muted);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 600;
            transition: 0.3s;
            margin-top: 20px;
        }

        .back-link:hover { color: var(--accent-gold); }

        /* Main Content Area */
        .main-content { 
            flex: 1; 
            margin-left: 260px; 
            padding: 50px; 
            background: radial-gradient(circle at 50% -20%, #1e293b 0%, var(--bg-deep) 70%);
        }

        .card { 
            background: var(--bg-card); 
            padding: 40px; 
            border-radius: 20px; 
            border: 1px solid var(--border);
            box-shadow: 0 20px 40px rgba(0,0,0,0.4); 
            max-width: 650px; 
        }

        h1 { margin: 0 0 10px 0; font-weight: 800; font-size: 1.75rem; }

        .form-group { margin-bottom: 25px; }

        /* Current Image Display */
        .current-img-container {
            background: var(--bg-deep);
            padding: 15px;
            border-radius: 12px;
            border: 1px solid var(--border);
            margin: 15px 0 25px 0;
            display: inline-block;
        }

        .current-img { 
            width: 120px; 
            height: 80px; 
            object-fit: cover; 
            border-radius: 8px; 
            display: block; 
            border: 1px solid var(--border);
        }

        /* Form Elements Style (Matches Add Page) */
        form p {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            width: 100%;
            margin-bottom: 25px !important; /* Spacing between fields */
            gap: 8px;
        }

        input:not([type="file"]), textarea, select {
            width: 100%;
            padding: 12px 14px;
            background: var(--bg-deep);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: white;
            box-sizing: border-box;
            font-family: inherit;
            transition: 0.3s;
        }

        input:focus { border-color: var(--accent-gold); outline: none; }

        /* File Input Styling */
        input[type="file"] {
            background: var(--bg-deep);
            padding: 8px;
            border-radius: 8px;
            border: 1px dashed var(--border);
        }

        input[type="file"]::file-selector-button {
            background: #1e293b;
            color: var(--accent-gold);
            border: 1px solid var(--border);
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            margin-right: 15px;
            transition: 0.3s;
        }

        input[type="file"]::file-selector-button:hover { background: var(--accent-gold); color: var(--bg-deep); }

        /* Action Buttons */
        .btn-save { 
            background: var(--accent-gold); 
            color: var(--bg-deep); 
            border: none; 
            padding: 14px 30px; 
            border-radius: 10px; 
            cursor: pointer; 
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: 0.3s;
        }

        .btn-save:hover { transform: translateY(-2px); filter: brightness(1.1); }

        .btn-cancel { 
            color: var(--text-muted); 
            text-decoration: none; 
            margin-left: 20px; 
            font-weight: 600;
            font-size: 0.9rem;
            transition: 0.3s;
        }

        .btn-cancel:hover { color: #ef4444; }

        hr { border: 0; border-top: 1px solid var(--border); margin: 25px 0; }
        
        /* Precise Form Alignment */
        form p {
            display: flex;
            flex-direction: column;
            align-items: flex-start; /* Ensures labels align to the far left */
            gap: 8px;
            margin-bottom: 24px; /* Uniform spacing between rows */
            width: 100%;
        }
        
        form label {
            font-weight: 700;
            color: var(--text-main);
            font-size: 0.95rem;
            margin-bottom: 2px;
        }
        
        /* Fix for the Image input alignment seen in your screenshot */
        input[type="file"] {
            width: 100%;
            box-sizing: border-box;
            display: block;
        }
        
        form p a {
            color: var(--accent-gold);
            font-size: 0.8rem;
            text-decoration: none;
            background: rgba(251, 191, 36, 0.1);
            padding: 4px 8px;
            border-radius: 4px;
            margin: 5px 0;
            display: inline-block;
            word-break: break-all; /* Prevents long file paths from breaking the card */
        }
        
        input[type="checkbox"] {
            width: 18px;
            height: 18px;
            margin-right: 10px;
            accent-color: var(--accent-gold);
            cursor: pointer;
            vertical-align: middle;
        }

        .btn-cancel {
            display: inline-block;
            width: 100%;
            text-align: center;
            margin-top: 15px;
            color: var(--text-muted);
        }
        /* Makes sure the big yellow button matches the input width perfectly */
        .btn-add, .btn-save {
            width: 100%;
            display: block;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <nav class="sidebar">
        <h2>LeasePro</h2>
        <a href="{% url 'dashboard' %}" class="back-link">
            <i class="fas fa-arrow-left"></i> Dashboard
        </a>
    </nav>

    <main class="main-content">
        <div class="card">
            <h1>Edit Property Details</h1>
            <p style="color: var(--text-muted); margin-top: 5px;">
                Updating: <strong style="color: var(--accent-gold);">{{ property.address }}</strong>
            </p>
            <hr>
            
            <form method="post" enctype="multipart/form-data">
                {% csrf_token %}
                
                {% if property.image %}
                    <div class="form-group">
                        <label style="font-weight: 600; font-size: 0.9rem; color: var(--text-muted);">Current Listing Image:</label>
                        <div class="current-img-container">
                            <img src="{{ property.image.url }}" class="current-img">
                        </div>
                    </div>
                {% endif %}

                <div class="form-group">
                    {{ form.as_p }}
                </div>

                <div style="margin-top: 30px;">
                    <button type="submit" class="btn-save">Update Listing</button>
                    <a href="{% url 'property_detail' property.pk %}" class="btn-cancel">Discard Changes</a>
                </div>
            </form>
        </div>
    </main>

</body>
</html>

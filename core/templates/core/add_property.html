<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Property | LeasePro</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #050a15;
            --bg-card: #0d1425;
            --accent-gold: #fbbf24;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #1e293b;
        }

        body {
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            font-family: 'Inter', sans-serif;
            background: radial-gradient(circle at 50% -20%, #1e293b 0%, var(--bg-deep) 70%);
            color: var(--text-main);
            padding: 20px;
        }

        .card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 40px;
            width: 100%;
            max-width: 550px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        h2 {
            color: var(--accent-gold);
            margin: 0 0 30px 0;
            font-weight: 700;
            font-size: 1.75rem;
            text-align: center;
        }

        /* Styling the Django form.as_p elements */
        form p {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 20px;
            font-weight: 600;
            font-size: 0.9rem;
            text-align: left;
        }

        /* High-contrast inputs to match login/signup */
        input, textarea, select {
            width: 100%;
            padding: 12px 14px;
            background: var(--bg-deep);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: white;
            box-sizing: border-box;
            font-family: inherit;
            transition: 0.3s;
        }

        input:focus, textarea:focus {
            outline: none;
            border-color: var(--accent-gold);
            box-shadow: 0 0 0 2px rgba(251, 191, 36, 0.1);
        }

        /* Help text generated by Django */
        .helptext {
            color: var(--text-muted);
            font-size: 0.75rem;
            font-weight: 400;
            margin-top: 5px;
        }

        /* Buttons */
        .btn-add {
            width: 100%;
            padding: 16px;
            background: var(--accent-gold);
            color: var(--bg-deep);
            border: none;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
            font-size: 1rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 15px;
        }

        .btn-add:hover {
            transform: translateY(-2px);
            filter: brightness(1.1);
            box-shadow: 0 10px 15px rgba(251, 191, 36, 0.2);
        }

        .btn-cancel {
            display: block;
            text-align: center;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 600;
            transition: 0.3s;
        }

        .btn-cancel:hover {
            color: #ef4444;
        }

        /* Error handling */
        .errorlist {
            color: #fca5a5;
            list-style: none;
            padding: 0;
            font-size: 0.8rem;
            margin-bottom: 10px;
        }
        
        /* Styling the "Choose File" button specifically */
        input[type="file"] {
            padding: 8px; /* Reduced padding for file input */
            cursor: pointer;
            background: var(--bg-deep);
        }
        
        input[type="file"]::file-selector-button {
            background: #1e293b; /* Subtle navy-blue for the button */
            color: var(--accent-gold);
            border: 1px solid var(--border);
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-family: 'Inter', sans-serif;
            margin-right: 15px;
            transition: 0.3s;
        }
        
        input[type="file"]::file-selector-button:hover {
            background: var(--accent-gold);
            color: var(--bg-deep);
        }
    </style>
</head>
<body>

<div class="card">
    <h2>List a New Property</h2>
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        
        <div class="form-group">
            {{ form.as_p }}
        </div>

        <button type="submit" class="btn btn-add">Upload & Post Listing</button>
        <a href="{% url 'dashboard' %}" class="btn-cancel">Cancel and Return</a>
    </form>
</div>

</body>
</html>

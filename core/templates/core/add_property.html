<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Property | LeasePro</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --bg-light: #f8fafc;
            --text-dark: #1e293b;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --danger: #ef4444;
            --white: #ffffff;
        }

        body {
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-light);
            /* Matching the subtle dot pattern from the home page */
            background-image: radial-gradient(#cbd5e1 0.5px, transparent 0.5px);
            background-size: 24px 24px;
            color: var(--text-dark);
            padding: 40px 20px;
        }

        .card {
            background: var(--white);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 40px;
            width: 100%;
            max-width: 550px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
        }

        .card-header {
            text-align: center;
            margin-bottom: 35px;
        }

        .card-header i {
            font-size: 2.5rem;
            color: var(--primary);
            margin-bottom: 15px;
        }

        h2 {
            color: var(--text-dark);
            margin: 0;
            font-weight: 800;
            font-size: 1.75rem;
            letter-spacing: -0.5px;
        }

        /* Django form.as_p styling */
        form p {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 22px;
            font-weight: 600;
            font-size: 0.85rem;
            color: var(--text-dark);
        }

        label {
            margin-bottom: 2px;
        }

        input, textarea, select {
            width: 100%;
            padding: 12px 16px;
            background: #f1f5f9;
            border: 1px solid var(--border);
            border-radius: 10px;
            color: var(--text-dark);
            box-sizing: border-box;
            font-family: inherit;
            font-size: 0.95rem;
            transition: all 0.2s;
        }

        input:focus, textarea:focus, select:focus {
            outline: none;
            background: var(--white);
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.1);
        }

        textarea {
            resize: vertical;
            min-height: 100px;
        }

        .helptext {
            color: var(--text-muted);
            font-size: 0.75rem;
            font-weight: 400;
            margin-top: 6px;
        }

        /* Primary Action Button */
        .btn-add {
            width: 100%;
            padding: 16px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 12px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 10px;
            margin-bottom: 20px;
        }

        .btn-add:hover {
            background: var(--primary-hover);
            transform: translateY(-1px);
            box-shadow: 0 10px 15px -3px rgba(37, 99, 235, 0.25);
        }

        .btn-cancel {
            display: block;
            text-align: center;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 600;
            transition: color 0.2s;
        }

        .btn-cancel:hover {
            color: var(--danger);
        }

        /* Error States */
        .errorlist {
            background: #fef2f2;
            color: var(--danger);
            list-style: none;
            padding: 12px;
            border-radius: 8px;
            font-size: 0.85rem;
            margin-bottom: 20px;
            border: 1px solid #fee2e2;
        }
        
        /* File Input Styling */
        input[type="file"] {
            padding: 10px;
            background: #f8fafc;
            border: 1px dashed var(--border);
        }
        
        input[type="file"]::file-selector-button {
            background: var(--primary);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-family: 'Inter', sans-serif;
            margin-right: 15px;
            transition: background 0.2s;
        }
        
        input[type="file"]::file-selector-button:hover {
            background: var(--primary-hover);
        }
    </style>
</head>
<body>

<div class="card">
    <div class="card-header">
        <i class="fas fa-plus-circle"></i>
        <h2>List a New Property</h2>
    </div>

    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        
        <div class="form-group">
            {{ form.as_p }}
        </div>

        <button type="submit" class="btn-add">
            <i class="fas fa-cloud-upload-alt"></i> Upload & Post Listing
        </button>
        
        <a href="{% url 'dashboard' %}" class="btn-cancel">
            <i class="fas fa-times"></i> Cancel and Return
        </a>
    </form>
</div>

</body>
</html>

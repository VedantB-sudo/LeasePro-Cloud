<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Access Denied | LeasePro</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-deep: #050a15;
            --bg-card: #0d1425;
            --accent-gold: #fbbf24;
            --accent-red: #ef4444;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #1e293b;
        }

        body {
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            font-family: 'Inter', sans-serif;
            /* Gradient shift: Central glow to match the restriction vibe */
            background: radial-gradient(circle at 50% 50%, rgba(239, 68, 68, 0.05) 0%, var(--bg-deep) 70%);
            color: var(--text-main);
            padding: 20px;
        }

        .error-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 60px 40px;
            text-align: center;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
        }

        i.fa-shield-halved {
            font-size: 5rem;
            color: var(--accent-red);
            margin-bottom: 25px;
            /* Subtle red glow around the icon */
            filter: drop-shadow(0 0 15px rgba(239, 68, 68, 0.3));
        }

        h1 { 
            margin: 10px 0; 
            font-weight: 800; 
            color: var(--text-main);
            letter-spacing: -1px;
        }

        p { 
            color: var(--text-muted); 
            line-height: 1.6; 
            margin-bottom: 35px;
            font-size: 1.05rem;
        }

        .btn-home {
            display: inline-block;
            background: var(--accent-gold);
            color: var(--bg-deep);
            padding: 14px 35px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .btn-home:hover {
            transform: translateY(-3px);
            filter: brightness(1.1);
            box-shadow: 0 10px 20px rgba(251, 191, 36, 0.2);
        }
    </style>
</head>
<body>

    <div class="error-card">
        <i class="fas fa-shield-halved"></i>
        <h1>Restricted Access</h1>
        <p>Oops! It looks like you don't have the necessary permissions to view this page. This area is reserved for authorized users only.</p>
        
        <a href="{% url 'home' %}" class="btn-home">Return to Safety</a>
    </div>

</body>
</html>

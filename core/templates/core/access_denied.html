<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Access Denied | LeasePro</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --bg-light: #f8fafc;
            --text-dark: #1e293b;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --danger: #ef4444;
            --danger-soft: #fef2f2;
        }

        body {
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-light);
            /* Subtle dot pattern background */
            background-image: radial-gradient(#cbd5e1 0.5px, transparent 0.5px);
            background-size: 24px 24px;
            color: var(--text-dark);
            padding: 20px;
        }

        .error-card {
            background: white;
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 60px 40px;
            text-align: center;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.05), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
        }

        .icon-container {
            width: 100px;
            height: 100px;
            background: var(--danger-soft);
            color: var(--danger);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            border-radius: 50%;
            margin: 0 auto 30px;
            border: 1px solid #fee2e2;
        }

        h1 { 
            margin: 10px 0; 
            font-weight: 800; 
            color: var(--text-dark);
            letter-spacing: -1px;
            font-size: 1.8rem;
        }

        p { 
            color: var(--text-muted); 
            line-height: 1.6; 
            margin-bottom: 35px;
            font-size: 1.05rem;
        }

        .btn-home {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: var(--primary);
            color: white;
            padding: 16px 35px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 700;
            transition: all 0.2s;
            border: none;
            cursor: pointer;
            width: 100%;
            box-sizing: border-box;
        }

        .btn-home:hover {
            background: var(--primary-hover);
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(37, 99, 235, 0.2);
        }

        .btn-home i {
            font-size: 0.9rem;
        }

        @media (max-width: 480px) {
            .error-card {
                padding: 40px 25px;
            }
        }
    </style>
</head>
<body>

    <div class="error-card">
        <div class="icon-container">
            <i class="fas fa-shield-halved"></i>
        </div>
        <h1>Restricted Access</h1>
        <p>Your account does not have the permissions required to access this resource. If you believe this is an error, please contact the system administrator.</p>
        
        <a href="{% url 'home' %}" class="btn-home">
            <i class="fas fa-arrow-left"></i> Return to Safety
        </a>
    </div>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delete Property | LeasePro</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #2563eb;
            --bg-light: #f8fafc;
            --text-dark: #1e293b;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --danger: #ef4444;
            --danger-hover: #dc2626;
            --danger-soft: #fef2f2;
            --white: #ffffff;
        }

        body { 
            background-color: var(--bg-light);
            /* Matching geometric background pattern */
            background-image: radial-gradient(#cbd5e1 0.5px, transparent 0.5px);
            background-size: 24px 24px;
            color: var(--text-dark); 
            font-family: 'Inter', sans-serif; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            margin: 0; 
            padding: 20px;
        }

        .confirm-card { 
            background: var(--white); 
            border: 1px solid var(--border); 
            padding: 50px 40px; 
            border-radius: 24px; 
            text-align: center; 
            max-width: 480px; 
            width: 100%;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.05);
        }

        .icon-container {
            width: 80px;
            height: 80px;
            background: var(--danger-soft);
            color: var(--danger);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            border-radius: 50%;
            margin: 0 auto 25px;
            border: 1px solid #fee2e2;
        }

        h2 { 
            margin: 0 0 15px 0; 
            font-weight: 800; 
            font-size: 1.75rem;
            letter-spacing: -1px;
            color: var(--text-dark);
        }

        p { 
            color: var(--text-muted); 
            line-height: 1.6; 
            margin-bottom: 35px;
            font-size: 1.05rem;
        }

        .property-tag {
            background: #f1f5f9;
            color: var(--text-dark);
            padding: 4px 10px;
            border-radius: 6px;
            font-weight: 700;
            display: inline-block;
            margin: 0 4px;
            border: 1px solid var(--border);
        }

        .actions {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn-confirm { 
            background: var(--danger); 
            color: white; 
            padding: 16px; 
            border: none; 
            border-radius: 12px; 
            font-weight: 700; 
            font-size: 1rem;
            cursor: pointer; 
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-confirm:hover { 
            background: var(--danger-hover);
            transform: translateY(-1px);
            box-shadow: 0 10px 15px -3px rgba(239, 68, 68, 0.25);
        }

        .btn-cancel { 
            background: var(--white); 
            color: var(--text-muted); 
            padding: 14px; 
            text-decoration: none; 
            border-radius: 12px; 
            font-weight: 600;
            font-size: 0.95rem;
            transition: all 0.2s;
            border: 1px solid var(--border);
        }

        .btn-cancel:hover { 
            background: #f8fafc;
            color: var(--text-dark);
            border-color: var(--text-muted);
        }

        @media (max-width: 480px) {
            .confirm-card { padding: 40px 25px; }
        }
    </style>
</head>
<body>
    <div class="confirm-card">
        <div class="icon-container">
            <i class="fas fa-trash-can"></i>
        </div>
        <h2>Confirm Deletion</h2>
        <p>Are you sure you want to remove <span class="property-tag">{{ property.address }}</span>? All data associated with this listing will be permanently purged.</p>
        
        <form method="post" class="actions">
            {% csrf_token %}
            <button type="submit" class="btn-confirm">
                <i class="fas fa-check"></i> Delete Permanently
            </button>
            <a href="{% url 'property_detail' pk=property.pk %}" class="btn-cancel">
                Cancel and Keep Listing
            </a>
        </form>
    </div>
</body>
</html>

# Required metadata
sonar.projectKey=VedantB-sudo_LeasePro-Cloud
sonar.projectName=LeasePro-Cloud
sonar.projectVersion=1.0

# Path to source folders
# "." ensures the root directory is scanned, including hidden folders
sonar.sources=.
sonar.language=py
sonar.sourceEncoding=UTF-8
sonar.python.version=3.11

# Secret Detection & YAML Analysis
# This ensures SonarQube looks for secrets and parses GitHub Action files
sonar.yaml.file.suffixes=.yaml,.yml
sonar.secrets.activated=true

# Coverage
sonar.python.coverage.reportPaths=coverage.xml

# Updated Exclusions
# Removed generic exclusions that might block hidden folders
# We keep exclusions for migrations and virtual environments to avoid noise
sonar.exclusions=**/migrations/**,manage.py,venv/**,static/**,media/**,**/tests.py